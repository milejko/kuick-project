name: "CD"

on:
  schedule:
    # twice per month
    - cron: "10 5 1,14 * *"
  push:
    tags:
      - "v*.*.*"

jobs:
  Testing:
    uses: milejko/kuick-project/.github/workflows/ci.yml@main

  Deployment:
    needs: Testing
    strategy:
      matrix:
        os-variant: ['noble', 'alpine', 'trixie']
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
    - 
      name: Checkout code
      uses: actions/checkout@v6
    - 
      name: Set up QEMU (multiplatform)
      uses: docker/setup-qemu-action@v4
    - 
      name: Set up Docker Buildx (multiplatform)
      uses: docker/setup-buildx-action@v4
    - 
      name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - 
      name: Prepare image metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: kuickphp/kuick
        tags: |
          type=raw,value=${{ matrix.os-variant }}
          type=semver,pattern={{major}},suffix=-${{ matrix.os-variant }}
          type=semver,pattern={{major}}.{{minor}},suffix=-${{ matrix.os-variant }}
          type=semver,pattern={{major}},enable=${{ 'noble' == matrix.os-variant }}
          type=semver,pattern={{major}}.{{minor}},enable=${{ 'noble' == matrix.os-variant }}
          type=raw,value=latest,enable=${{ 'noble' == matrix.os-variant }}
    - 
      name: Build & push to Docker Hub
      uses: docker/build-push-action@v7
      with:
        push: true
        platforms: linux/amd64,linux/arm64,linux/arm/v7
        target: dist
        tags: ${{ steps.meta.outputs.tags }},
        labels: ${{ steps.meta.outputs.labels }},
        build-args: |
          PHP_VERSION=8.5
          OS_VARIANT=${{ matrix.os-variant }}
